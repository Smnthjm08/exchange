[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web ="4.13.0"
dotenv = "0.15.0"
sqlx = { version = "0.8.6", features = [
    "postgres",
    "runtime-tokio",
    "macros",
    "uuid",
    "time",
] }
db = { path = "../db" }
anyhow = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
sha256 = "1.6.0"
chrono = "0.4.44"
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
env_logger = "0.10.0"
uuid = { version = "1", features = ["v4", "serde"] }
time = "0.3"
