[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1.0.229", features = ["derive"] }
tracing-subscriber = "0.3"
serde_json = "1.0.151"
db = { path = "../db" }
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio"] }
anyhow = "1.0.104"
dotenvy = "0.15.7"
argon2 = "0.5.3"
uuid = { version = "1.24.1", features = ["v4", "serde"] }
jsonwebtoken = "11.0.0"
