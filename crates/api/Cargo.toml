[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1.0.229", features = ["derive"] }
tracing-subscriber = "0.3"
serde_json = "1.0.151"
db = { path = "../db" }
common ={path = "../common"}
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio"] }
anyhow = "1.0.104"
dotenvy = "0.15.7"
argon2 = { version = "0.5.3", features = ["std"] }
uuid = { version = "1.24.1", features = ["v4", "serde"] }
jsonwebtoken ={ version = "11.0.0", features = ["aws_lc_rs"] }

chrono = { version = "0.4.45", features = ["serde"] }
