services:
  postgres_db:
    image: postgres:16-alpine
    container_name: cex_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cex_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cex_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
